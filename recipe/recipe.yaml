schema_version: 1

context:
  name: hklpy2
  version: "1.0.1rc2"

package:
  name: hklpy2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: "a8bd72904430faf07169182ec8560090d8ae79e22d9d5d11540743f163a7f136"

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm >=8
  run:
    - bluesky-tiled-plugins >=2.0.12
    - bluesky-base
    - cytoolz
    - deprecated
    # - hkl  Users must name this separately now to install 
    - numpy
    - ophyd >=1.7
    - pandas
    - pint
    - pyresttable
    - python >=${{ python_min }}
    - ruamel.yaml
    - tiled
    - tqdm
    - typeguard

tests:
  - python:
      imports:
        - hklpy2
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
    - python -c "import hklpy2; solvers = hklpy2.solvers(); assert len(solvers) in (2, 3); print(solvers)"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: 2nd generation controls for diffractometers as PseudoPositioners in the Bluesky Framework.
  homepage: https://blueskyproject.io/hklpy2/
  license: BSD-4-Clause
  license_file: LICENSE
  documentation: https://blueskyproject.io/hklpy2/
  repository: https://github.com/bluesky/hklpy2

extra:
  recipe-maintainers:
    - prjemian
